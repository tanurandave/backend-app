spring.application.name=backend-app

server.port=8080

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/training_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# HikariCP Connection Pooling (Industry Standard for Production)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.main.allow-circular-references=true

# JWT Configuration
jwt.secret=traininginstitutesecretkeywhichisverylongandsecure123456789
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Mail Configuration (Gmail SMTP)
# STEP 1: Replace username with your real Gmail address
# STEP 2: Replace password with a Gmail App Password (NOT your login password)
#         Get one at: https://myaccount.google.com/apppasswords
# Until configured, the OTP will be printed in the Spring Boot console instead.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=randavetanuja@gmail.com
spring.mail.password=Anuj@_2004
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

# OTP expiry in minutes
otp.expiry.minutes=10
